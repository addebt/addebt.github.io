<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Split Debt</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    .consumer-checks .form-check-inline { margin-right: .75rem; }
    @media (max-width: 575.98px) {
      h1.h3 { font-size: 1.25rem; }
    }
  </style>
</head>
<body class="bg-light">
  <div class="container py-3 py-md-4" x-data="splitDebt()" x-init="init()" x-cloak>

    <header class="d-flex flex-wrap gap-2 justify-content-between align-items-center mb-3">
      <h1 class="h3 m-0">Split&nbsp;Debt</h1>
      <div class="btn-group">
        <button class="btn btn-outline-secondary btn-sm" @click="resetCalc()" :disabled="!calc.persons.length && !calc.spends.length">
          Очистить
        </button>
        <button class="btn btn-primary btn-sm" @click="copyShareLink()">
          <span x-text="shareCopied ? 'Скопировано ✓' : 'Поделиться'"></span>
        </button>
      </div>
    </header>

    <section class="card mb-3">
      <div class="card-header d-flex flex-wrap gap-2 justify-content-between align-items-center">
        <span class="fw-medium">Участники</span>
        <button class="btn btn-outline-primary btn-sm" @click="addAdHocPerson()">
          Добавить
        </button>
      </div>

      <ul class="list-group list-group-flush" x-show="calc.persons.length">
        <template x-for="(p, i) in calc.persons" :key="p.id">
          <li class="list-group-item">
            <div class="row g-2 align-items-center">
              <div class="col-12 col-md-5">
                <input class="form-control form-control-sm" placeholder="Имя" x-model="p.name">
              </div>
              <div class="col-9 col-md-6">
                <select class="form-select form-select-sm" x-model="p.groupId" @change="onPersonGroupChange(p)">
                  <option value="">— без кошелька —</option>
                  <template x-for="g in calc.groups" :key="g.id">
                    <option :value="g.id" x-text="g.name || '(кошелёк)'"></option>
                  </template>
                  <option value="__new__">+ Новый кошелёк…</option>
                </select>
              </div>
              <div class="col-3 col-md-1 text-end">
                <button class="btn btn-sm btn-outline-danger" @click="removeParticipant(i)" title="Удалить">×</button>
              </div>
            </div>
          </li>
        </template>
      </ul>

      <div class="card-body py-3" x-show="!calc.persons.length">
        <p class="text-muted m-0 small">Добавь участников расчёта.</p>
      </div>
    </section>

    <section class="card mb-3">
      <div class="card-header d-flex justify-content-between align-items-center">
        <span class="fw-medium">Траты</span>
        <button class="btn btn-sm btn-outline-primary" @click="addSpend()" :disabled="calc.persons.length < 2">
          Добавить
        </button>
      </div>

      <ul class="list-group list-group-flush" x-show="calc.spends.length">
        <template x-for="(s, i) in calc.spends" :key="s.id">
          <li class="list-group-item">
            <div class="row g-2 align-items-center mb-2">
              <div class="col-7 col-md-3">
                <input type="number" inputmode="decimal" step="0.01" min="0"
                       class="form-control form-control-sm" placeholder="Сумма" x-model="s.value">
              </div>
              <div class="col-12 col-md-4 order-md-0 order-1">
                <select class="form-select form-select-sm" x-model="s.sponsorId">
                  <option value="">— кто заплатил —</option>
                  <template x-for="p in calc.persons" :key="p.id">
                    <option :value="p.id" x-text="p.name || '—'"></option>
                  </template>
                </select>
              </div>
              <div class="col-12 col-md-4 order-md-0 order-2 d-flex align-items-center">
                <div class="form-check">
                  <input class="form-check-input" type="checkbox" :id="'all-' + s.id"
                         :checked="s.consumerIds === '__all__'" @change="toggleAllConsumers(s)">
                  <label class="form-check-label small" :for="'all-' + s.id">На всех</label>
                </div>
              </div>
              <div class="col-5 col-md-1 text-end order-md-0 order-0">
                <button class="btn btn-sm btn-outline-danger" @click="removeSpend(i)" title="Удалить">×</button>
              </div>
            </div>
            <div x-show="s.consumerIds !== '__all__'" class="consumer-checks pt-1">
              <small class="text-muted d-block mb-1">Кто пользовался:</small>
              <template x-for="p in calc.persons" :key="p.id">
                <div class="form-check form-check-inline">
                  <input class="form-check-input" type="checkbox" :id="`c-${s.id}-${p.id}`"
                         :checked="Array.isArray(s.consumerIds) && s.consumerIds.includes(p.id)"
                         @change="toggleConsumer(s, p.id)">
                  <label class="form-check-label small" :for="`c-${s.id}-${p.id}`" x-text="p.name || '—'"></label>
                </div>
              </template>
            </div>
          </li>
        </template>
      </ul>

      <div class="card-body py-3" x-show="!calc.spends.length">
        <p class="text-muted m-0 small" x-text="calc.persons.length < 2 ? 'Сначала добавь хотя бы двух участников.' : 'Добавь траты.'"></p>
      </div>
    </section>

    <section class="card mb-3" x-show="result">
      <div class="card-header fw-medium">Результат</div>
      <div class="card-body">
        <h2 class="h6">Балансы по кошелькам</h2>
        <ul class="list-group list-group-flush mb-3">
          <template x-for="b in result?.balances || []" :key="b.wallet">
            <li class="list-group-item d-flex justify-content-between align-items-center px-0"
                :class="{
                  'text-success': b.sign < 0,
                  'text-danger': b.sign > 0,
                  'text-muted': b.sign === 0
                }">
              <span x-text="b.name"></span>
              <span class="font-monospace" x-text="b.display"></span>
            </li>
          </template>
        </ul>
        <h2 class="h6">Транзакции</h2>
        <ul class="list-group list-group-flush" x-show="result?.transactions?.length">
          <template x-for="(t, i) in result?.transactions || []" :key="i">
            <li class="list-group-item d-flex justify-content-between align-items-center px-0">
              <span>
                <span x-text="t.fromName"></span>
                <span class="mx-2 text-muted">→</span>
                <span x-text="t.toName"></span>
              </span>
              <span class="fw-bold font-monospace" x-text="t.display"></span>
            </li>
          </template>
        </ul>
        <p class="text-muted small m-0" x-show="!result?.transactions?.length">Все балансы нулевые.</p>
      </div>
    </section>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/decimal.js@10.4.3/decimal.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/lz-string@1.5.0/libs/lz-string.min.js"></script>
  <script src="app.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.13.10/dist/cdn.min.js"></script>

  <style>[x-cloak] { display: none !important; }</style>
</body>
</html>
